name: macOS viewer

# Builds Switch Frame Tap.app for Apple Silicon and Intel Macs
# (tools/raw-recv/build-macos.sh). Run by hand from the Actions tab, or on a
# version tag; the zips are the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in the zip names (default: the branch or tag)'
        required: false
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15   # Apple Silicon (macos-14 retires 2026-11-02; build-macos.sh targets macOS 12)
          - runner: macos-15-intel   # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # FFmpeg and SDL 2 take most of the build: keep them between runs. The key
      # follows build-macos.sh, so changing their versions or settings there
      # builds them fresh.
      - uses: actions/cache@v4
        with:
          path: |
            ref/macos-*/ffmpeg-min
            ref/macos-*/sdl2
          key: macos-deps-${{ matrix.runner }}-${{ hashFiles('tools/raw-recv/build-macos.sh') }}
      - name: Dependencies
        run: brew install libusb pkg-config nasm cmake
      - name: Build
        run: |
          v="${{ inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          bash tools/raw-recv/build-macos.sh "${v//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-macos-${{ matrix.runner }}
          path: dist/switch-frame-tap-*-macos-*.zip
